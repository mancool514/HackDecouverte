{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <!-- Zone pour afficher les messages d'erreur ou de succès de Flask -->
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <div class="auth-box">
        <!-- Formulaire de Connexion -->
        <div class="form-section">
            <h2>Se connecter</h2>
            <form method="POST" action="{{ url_for('main.login') }}">
                <label for="login-username">Nom d'utilisateur</label>
                <input type="text" id="login-username" name="username" placeholder="Ton pseudo" required>

                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" name="password" placeholder="••••••••" required>

                <button type="submit" class="btn-primary">Connexion</button>
            </form>
        </div>

        <hr class="divider">

        <!-- Formulaire d'Inscription -->
        <div class="form-section">
            <h2>Créer un compte</h2>
            <form method="POST" action="{{ url_for('main.register') }}">
                <label for="reg-username">Choisis un pseudo</label>
                <input type="text" id="reg-username" name="username" placeholder="Nouveau pseudo" required>

                <label for="reg-password">Choisis un mot de passe</label>
                <input type="password" id="reg-password" name="password" placeholder="••••••••" required>

                <button type="submit" class="btn-secondary">S'inscrire</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
