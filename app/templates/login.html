{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="form-section">
            <h2>Se connecter</h2>
            <form method="POST" action="{{ url_for('main.login') }}">
                <label for="login-username">Nom d'utilisateur</label>
                <input type="text" id="login-username" name="username" placeholder="Ton pseudo" required autofocus>

                <label for="login-password">Mot de passe</label>
                <input type="password" id="login-password" name="password" placeholder="••••••••" required>

                <button type="submit" class="btn-primary">Connexion</button>
            </form>
        </div>

        <div class="form-section demo-info">
            <h2>Comptes de démo</h2>
            <p><strong>marie</strong> / marie123</p>
            <p><strong>lucas</strong> / lucas123</p>
        </div>
    </div>
</div>
{% endblock %}
